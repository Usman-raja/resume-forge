# Cloudflare Pages config. /launch copies this to wrangler.toml and fills in the database id.
name = "resume-forge"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "resume-forge-db"
database_id = "cbb371c2-351f-48b3-b5ff-eb90d6ac848c"

[vars]
AI_DAILY_CREDITS = "15"
AI_GUEST_DAILY_CREDITS = "6"
AI_GLOBAL_DAILY_CREDITS = "100"
GOOGLE_CLIENT_ID = "465229273408-4v81u6e4m8oqgb46eimm1l5chrncn2co.apps.googleusercontent.com"
